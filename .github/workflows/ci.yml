name: PranaAI Enterprise CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Execute Automated Test Matrix
      run: |
        python -m pytest tests/ -v

    - name: Enforce Zero-Secret & Ponytail Method Compliance
      run: |
        # Verify no hardcoded API keys exist in repository
        ! git grep -iE "(AIzaSy[-0-9A-Za-z_]{33}|sk-[a-zA-Z0-9]{20,})" -- ':!tests' ':!.env.example'
        echo "Zero-Secret Ponytail Security Policy: Verified clean."
