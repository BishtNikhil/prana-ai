[project]
name = "prana-ai"
version = "1.0.0"
description = "Autonomous Urban Air Quality Assistant & Winter Smog Inversion Copilot for PromptWars Challenge 06"
authors = [
    { name = "Nikhil Singh Bisht", email = "nikhilbisht2807@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
